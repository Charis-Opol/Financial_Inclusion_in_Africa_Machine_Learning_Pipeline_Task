# Local deployment of the prediction service.
#   docker compose up --build        -> http://localhost:8000/docs
services:
  # Dashboard uses the separate XAI dependency stack and reads data/artifacts
  # from read-only host mounts, keeping survey data out of the built image.
  #   docker compose up --build dashboard -> http://localhost:8501
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: fin-inclusion-dashboard:latest
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./models/production:/app/models/production:ro
      - ./models/xai:/app/models/xai:ro
      - ./reports/xai:/app/reports/xai:ro
      - ./reports/figures/xai:/app/reports/figures/xai:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fin-inclusion-api:latest
    ports:
      # Bound to loopback only: this API scores personal survey data and has no
      # auth layer, so it must not be reachable from the LAN by default.
      - "127.0.0.1:8000:8000"
    environment:
      LOG_LEVEL: INFO
      INFERENCE_THREADS: "1"
    volumes:
      # Named volume, not a bind mount: survives `down`/rebuilds, and Docker
      # seeds it with the image's ownership of /app/logs, so the non-root user
      # can write to it on Linux hosts too (bind mounts would be host-owned).
      - prediction-logs:/app/logs
    deploy:
      resources:
        # 1 CPU matches the single uvicorn worker + INFERENCE_THREADS=1.
        # Memory: measured ~76 MiB after startup + first requests (model is
        # 1.5 MB); 512M leaves headroom for bursts without masking a leak.
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    # Hardening: the app only needs to write to /app/logs (a volume) and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    # Long enough for the prediction-log writer to flush its queue on shutdown.
    stop_grace_period: 15s

  # On-demand / schedulable PSI drift check over the accumulated prediction log.
  # Not started by `up` (profile "jobs"); run it with:
  #   docker compose run --rm drift-check                      # pooled, last 7 days
  #   docker compose run --rm drift-check --country Uganda --hours 24
  # Exit code: 0 stable, 10 moderate, 20 significant, 30 insufficient data, 1 error.
  drift-check:
    image: fin-inclusion-api:latest
    profiles: ["jobs"]
    entrypoint: ["python", "-m", "fin_inclusion.monitoring.drift_check",
                 "--log-dir", "/app/logs",
                 "--reference", "/app/models/production/reference_profile.json"]
    volumes:
      # Read-only: the job must never be able to alter the audit trail it inspects.
      - prediction-logs:/app/logs:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  prediction-logs:
